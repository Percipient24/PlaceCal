# US geography this deployment covers, resolved locally with no network call.
#
# Towns are the primary geographic unit and the only ones that become
# Neighbourhood rows: db/seeds/002_scottsville.rb seeds one district-level
# Neighbourhood per town, keyed by the town code (unit_code_value), and the
# geocoder result's codes carry the town code, so any address in a listed ZIP
# maps to its town. ZIPs are just address data — they appear here only so a ZIP
# entered on an address can be geocoded, and in the Address's postcode field.
# A ZIP that spans several towns can be listed under each of them; the address
# then links to the first listed town that has a Neighbourhood row.
#
# ZIPs not listed under any town go to zippopotam.us (keyless, US-only) outside
# test — matched back to a covered town by place name where possible — and to
# the 'default' stub in test, so specs never hit the network.
towns:
  # Scottsville, NY (Monroe County). The centroid is the fallback pin when
  # street-level geocoding has no match; street-level coords come from the US
  # Census geocoder (see UsZipLookup.street_level).
  SCOTTSVL:
    place: Scottsville
    county: Monroe County
    state: NY
    state_name: New York
    latitude: 43.0246
    longitude: -77.7743
    zips:
      "14546": # ZIP centroid (zippopotam.us)
        latitude: 43.0246
        longitude: -77.7743

# Stub returned for any unlisted ZIP in the test environment.
default:
  place: Testville
  county: Test County
  state: NY
  state_name: New York
  latitude: 43.0
  longitude: -77.8
